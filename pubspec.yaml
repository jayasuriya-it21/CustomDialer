name: google_dialer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  record: ^6.2.0
  uuid: ^4.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_contacts: ^2.0.2
  url_launcher: ^6.3.2
  intl: ^0.20.2
  just_audio: ^0.9.43
  share_plus: ^10.1.4
  dynamic_color: ^1.8.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^17.2.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpeg"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/app_icon.jpeg"